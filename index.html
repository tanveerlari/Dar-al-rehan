    <!-- 🚫 Aggressive CSS to block and remove Netlify Badge completely -->
    <style>
      .netlify-badge,
      #netlify-badge,
      [data-netlify-badge],
      div[class*="netlify-badge"],
      div[class*="netlify"],
      a[href*="netlify.com"],
      #netlify-drawer-container,
      [data-netlify-drawer],
      netlify-drawer,
      iframe[src*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
  </head>

  </body>
